# GitLab Pages — 대시보드 정적 배포 전용.
# 크롤러는 여기서 돌리지 않는다: 매시간 수집만으로 무료 CI 한도(400분/월)를 넘긴다.
# 수집은 PC 작업 스케줄러 + Supabase pg_cron 담당.
pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public
    - cp index.html styles.css app.js system_prompt.js lawmap_articles.js public/   # 새 정적 파일은 여기에도 추가해야 GitLab Pages에 실린다(GitHub Pages는 저장소 전체를 서빙) — #125에서 404로 실측
    - mkdir -p public/supabase/functions/_shared && cp supabase/functions/_shared/cite_verify.js public/supabase/functions/_shared/   # 텔레그램·대시보드 공용 인용 검증 모듈(#155) — index.html이 이 경로로 로드
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
