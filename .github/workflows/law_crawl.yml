name: 법령 개정·입법예고 모니터링

on:
  schedule:
    # 매일 02:00 UTC = 11:00 KST
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run law crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LAW_OC_KEY: ${{ secrets.LAW_OC_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python law_crawler.py

      - name: Summarize amendments (AI)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LAW_OC_KEY: ${{ secrets.LAW_OC_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python summarize_law_amendments.py

      # 시행일이 도래한 시행예정본을 현행으로 승격(조문은 이미 적재돼 있으므로 상태 전환만).
      # 감시보다 먼저 돌려야 승격된 문서가 그날 감시의 기준본이 된다.
      - name: Promote due pending law versions
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LAW_OC_KEY: ${{ secrets.LAW_OC_KEY }}
        run: python law_sync.py --promote

      # 지식베이스 등재 법령이 법제처 현행본과 어긋나는지 대조(감시만 — 교체는 PC에서 law_sync.py)
      - name: Watch knowledge-base law currency
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LAW_OC_KEY: ${{ secrets.LAW_OC_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python law_watch.py
