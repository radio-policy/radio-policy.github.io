name: 법령 개정·입법예고 모니터링

on:
  schedule:
    # 매일 02:00 UTC = 11:00 KST
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 50분이던 것을 90분으로 (2026-09-22). 정상일 때 체인 전체가 29분(law_crawler 2분 +
    # law_watch 27분)이라 여유가 21분뿐이었고, 법제처 API가 느려진 날 law_crawler 혼자
    # 32분을 먹자 law_watch가 18분 만에 잘렸다(run 35679673519, 감시 271건 중 10건만 처리).
    # 잘리면 그날 현행성 점검이 통째로 없어지고 heartbeat도 안 찍혀 워치독이 26h 경보를 낸다.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run law crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LAW_OC_KEY: ${{ secrets.LAW_OC_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python law_crawler.py

      - name: Summarize amendments (AI)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LAW_OC_KEY: ${{ secrets.LAW_OC_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python summarize_law_amendments.py

      # 시행일이 도래한 시행예정본을 현행으로 승격(조문은 이미 적재돼 있으므로 상태 전환만).
      # 감시보다 먼저 돌려야 승격된 문서가 그날 감시의 기준본이 된다.
      - name: Promote due pending law versions
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LAW_OC_KEY: ${{ secrets.LAW_OC_KEY }}
        run: python law_sync.py --promote

      # 정의 조문(제N조(정의)) → law_terms 재추출 — 대시보드 '법적 용어 정의' 탭 (#156). AI 0회, Supabase만.
      # 승격(--promote) 뒤·감시(law_watch) 앞: 감시는 법제처 대조만 하고 KB를 바꾸지 않으며, 50분 잡 한도를 다 쓴 실측(2026-09-11)이 있어
      # 그 뒤에 두면 건너뛰어진다. 실패해도 나머지 체인과 무관.
      - name: Sync law term definitions (law_terms, no AI)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python law_terms_sync.py

      # 지식베이스 등재 법령이 법제처 현행본과 어긋나는지 대조(감시만 — 교체는 다음 단계)
      - name: Watch knowledge-base law currency
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LAW_OC_KEY: ${{ secrets.LAW_OC_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python law_watch.py

      # 감시가 찾아낸 구버전을 실제로 교체한다 (2026-09-22 신설, #183).
      # 그동안 이 단계가 없어 law_watch의 "이어서 자동 현행화됩니다"라는 알림 문구가
      # 사실이 아니었고, 구버전 5건이 최대 3주까지 자문 근거로 쓰였다(고시 1건 12일).
      # 반드시 law_watch 뒤에 둘 것 — 대상은 law_watch가 방금 갱신한 sync_status='outdated'다.
      # VOYAGE_API_KEY는 law_sync가 끝에 부르는 backfill_embeddings.py용(없으면 새 조문이
      # 검색에 안 잡힌다). 실패해도 체인의 앞 단계 결과는 이미 남았으므로 continue-on-error.
      # 안전장치 3종 (#197, 2026-09-24, 운영자 결정 — 지침 '무인 자동화 전 OKF 자동 갱신' 규칙을 조건부 허용으로 개정):
      #  ① --keep-old: 구판을 superseded로만 두고 보존 상한 초과분 삭제는 무인으로 돌리지 않는다(정리는 사람이 --doc-name으로)
      #  ② 재진입 시 청크 수 대조(law_sync.py 안): 앞선 실행이 반쯤 넣고 죽은 신본을 '이미 등재됨'으로 넘기지 않는다
      #  ③ 교체 완료 텔레그램(무엇이 무엇으로, 청크 수 변화, OKF 요약 어긋남) — TELEGRAM_* 필요
      - name: Sync outdated laws to current version
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LAW_OC_KEY: ${{ secrets.LAW_OC_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python law_sync.py --all-outdated --keep-old

      # OKF 요약 자동 갱신 (#198, 2026-09-24 운영자 결정 ⓓ '완전 자동'): 조문이 새 판으로 바뀐 법령의 요약을
      # Sonnet이 '새 판 전문 + 구판 요약(구조 참고)'으로 전면 재작성 → 새 path로 적재, 구판 행은 superseded 보존.
      # 실행당 5건 상한(비용 ≈ $2~3), 나머지는 다음 날. 입력 60만 토큰 초과 법령은 보류(세션 처리). 결과는 텔레그램.
      # 번들(regulatory-kb)에는 안 쓴다 — sync_kb_to_bundle.py가 역동기화(웹 생성 OKF와 같은 경로).
      - name: Refresh OKF summaries for replaced laws (Sonnet)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python okf_refresh.py

      # OKF 요약(kb_documents)이 조문 현행본과 판이 어긋난 법령 대조 (#197). AI 0회, Supabase만.
      # okf_refresh 뒤에 두어 자동 갱신 뒤에도 남은 것(실패·보류)만 알린다.
      # --promote 승격도 어긋남을 만들므로(지방세법 시행령 9/18) 교체 스텝과 별도로 매일 돈다.
      # 어긋남 집합이 지난번과 달라진 날만 운영자 텔레그램(같은 목록 반복 금지 — #183 ⑤ 교훈).
      - name: Check OKF summary drift
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python okf_drift_check.py --notify
