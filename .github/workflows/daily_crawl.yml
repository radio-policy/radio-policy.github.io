name: 전파정책 일일 자동 크롤링

on:
  schedule:
    - cron: '17 * * * *'        # 매시 :17 (24h) — GitHub 백업(실제로는 불규칙하게 하루 5~6회 도착). 주 트리거는 Supabase pg_cron(crawl-trigger-hourly, jobid 9) **10분마다**(`*/10`, 2026-09-20 #174; 그 전엔 :47 매시)
  workflow_dispatch:             # GitHub에서 수동 실행 버튼

# 10분 주기(#174)에서는 앞 실행(2~5분)이 끝나기 전에 다음 dispatch가 올 수 있다. 두 인스턴스가 동시에 돌면 같은 기사를
# 서로 새 것으로 판단해 큐에 두 번 넣는다(2026-08-03 사고). 같은 그룹은 줄 세워 하나씩만 돌린다(취소 아님 — 대기).
concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 패키지 설치
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 방미통위 의사일정 PDF(kmcc_meeting.py) — press_ingest 가 Poppler pdftotext 바이너리에 의존한다.
      # 없으면 PDF 텍스트가 조용히 '' 가 되어 제목·링크만 저장된다. 실패해도 뉴스 크롤러는 돌아야 한다.
      - name: Poppler(pdftotext) 설치 — 방미통위 의사일정 PDF
        continue-on-error: true
        run: sudo apt-get install -y -qq --no-install-recommends poppler-utils

      - name: 크롤러 실행
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EMAIL_FROM:           ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD:       ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:             ${{ secrets.EMAIL_TO }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          SUBSCRIBER_BOT_TOKEN: ${{ secrets.SUBSCRIBER_BOT_TOKEN }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          NAVER_CLIENT_ID:      ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:  ${{ secrets.NAVER_CLIENT_SECRET }}
          VOYAGE_API_KEY:       ${{ secrets.VOYAGE_API_KEY }}   # 이슈맵 제안 파이프 임베딩 (2026-08-26)
          # 긴급 큐 적재 직후 즉시 배달 호출(subscriber_notify._trigger_delivery). 2026-09-20까지 이 스텝에 없어서
          # 구독자 봇은 매시 :25 정기 배달만 됐다(#174). GitHub 시크릿 CRON_SECRET은 2026-09-20 등록.
          CRON_SECRET:          ${{ secrets.CRON_SECRET }}
        run: python crawler.py

      # 방미통위 위원회 회의 의사일정·'제N차 위원회 결과' 수집 (2026-09-11 #154).
      # 게시 시각이 15~19시에 몰리고 회의 전날·당일에 바로 받아야 하므로 뉴스와 같은 실행(10분마다, #174)에 편승한다.
      # 새 글이 없으면 AI 호출 0 — 페이지 확인만 하므로 주기를 짧게 해도 비용이 없다(실측 하루 1콜).
      # kmcc.go.kr 은 Actions 데이터센터 IP 에서 열린다(#113). crawler.py 가 실패해도 실행하고,
      # 이 스텝이 실패해도 워크플로 결론(health_watchdog 감시 대상)을 바꾸지 않는다 — continue-on-error 를 지우지 말 것.
      - name: 방미통위 회의 의사일정·위원회 결과 수집 (kmcc_meeting.py)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          CRON_SECRET:          ${{ secrets.CRON_SECRET }}       # 큐 적재 직후 즉시 배달 호출(subscriber_notify._trigger_delivery)
        run: python kmcc_meeting.py
